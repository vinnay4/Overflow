<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="DM Sans, system-ui, sans-serif">
  <rect width="800" height="560" fill="#FAF7F0"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#1F2A33">Ubaal: the pot's sound closes the loop</text>
  <text x="20" y="58" font-size="14" fill="#6b6357">Annotated sketch (redraw by hand for the final deck if you prefer)</text>
  <!-- stove -->
  <rect x="120" y="440" width="300" height="18" rx="4" fill="#57534e"/>
  <g fill="#3b82f6" opacity=".85"><path d="M150 440 q8 -30 16 0z"/><path d="M190 440 q8 -36 16 0z"/><path d="M230 440 q8 -30 16 0z"/><path d="M270 440 q8 -36 16 0z"/><path d="M310 440 q8 -30 16 0z"/><path d="M350 440 q8 -36 16 0z"/></g>
  <!-- pot -->
  <path d="M130 250 L130 430 L410 430 L410 250" fill="none" stroke="#57534e" stroke-width="8"/>
  <rect x="134" y="352" width="272" height="74" fill="#FFF8EC"/>
  <path d="M134 352 q34 -6 68 0 t68 0 t68 0 t68 0" stroke="#c28c3c" stroke-width="4" fill="none"/>
  <g fill="#fff" stroke="#d6d3d1"><circle cx="170" cy="410" r="6"/><circle cx="210" cy="395" r="5"/><circle cx="260" cy="415" r="7"/><circle cx="320" cy="400" r="5"/><circle cx="360" cy="412" r="6"/></g>
  <line x1="420" y1="250" x2="470" y2="250" stroke="#b91c1c" stroke-dasharray="5 4"/><text x="474" y="254" font-size="14" fill="#b91c1c">rim</text>
  <line x1="420" y1="352" x2="470" y2="352" stroke="#6b6357" stroke-dasharray="5 4"/><text x="474" y="356" font-size="14" fill="#6b6357">milk surface</text>
  <path d="M445 256 L445 346" stroke="#1F2A33" marker-end="url(#a)" marker-start="url(#a)"/><text x="452" y="305" font-size="14" fill="#1F2A33">headroom → V_free</text>
  <text x="150" y="340" font-size="13" fill="#a16207">skin (whey + casein + fat): gives bubbles a lifetime Σ</text>
  <!-- sound waves -->
  <g stroke="#C2410C" fill="none" stroke-width="3" opacity=".9"><path d="M430 300 q30 -20 0 -60"/><path d="M455 310 q45 -35 0 -90"/><path d="M480 320 q60 -50 0 -120"/></g>
  <text x="480" y="150" font-size="15" fill="#C2410C" font-weight="700">1 · hiss, 150–1000 Hz</text><text x="480" y="170" font-size="13" fill="#C2410C">subcooled bubbles collapse</text>
  <!-- phone -->
  <rect x="610" y="190" width="120" height="220" rx="18" fill="#1F2A33"/><rect x="620" y="210" width="100" height="170" rx="8" fill="#FAF7F0"/>
  <circle cx="670" cy="270" r="36" fill="none" stroke="#f59e0b" stroke-width="9"/><text x="670" y="275" font-size="12" text-anchor="middle" font-weight="700" fill="#1F2A33">TURN</text><text x="670" y="290" font-size="12" text-anchor="middle" font-weight="700" fill="#1F2A33">TO SIM</text>
  <text x="670" y="340" font-size="11" text-anchor="middle" fill="#6b6357">PRE-BOIL</text>
  <text x="560" y="436" font-size="14" fill="#1F2A33" font-weight="700">2 · hiss peaks, fades 4 dB</text><text x="560" y="454" font-size="14" fill="#1F2A33" font-weight="700">→ alarm</text>
  <text x="560" y="472" font-size="12" fill="#6b6357">≈24 s before boil (MODEL)</text>
  <!-- hand -->
  <path d="M610 500 C 540 530, 470 520, 420 462" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#b)"/>
  <text x="120" y="500" font-size="15" fill="#1d4ed8" font-weight="700">3 · person turns knob down</text><text x="120" y="520" font-size="14" fill="#1d4ed8">→ Q_v ↓ → Π &lt; 1 at the boil</text>
  <text x="20" y="100" font-size="17" fill="#1F2A33">Π = Σ · Q_v / V_free</text>
  <text x="20" y="124" font-size="14" fill="#b91c1c">before: Π ≈ 3.9 → foam reaches rim in ~1 s (MODEL)</text>
  <text x="20" y="144" font-size="14" fill="#15803d">after turn-down: Π ≈ 0.8 → foam stops below rim (MODEL)</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8z" fill="#1F2A33"/></marker>
  <marker id="b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1d4ed8"/></marker></defs>
</svg>
